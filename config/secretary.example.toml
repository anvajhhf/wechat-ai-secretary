[secretary]
# 每套运行档案必须唯一；另一套使用 partner。
profile_id = "owner"
dry_run = true
timezone = "Asia/Shanghai"
max_actions_per_message = 3
worker_limit = 4

[wechat]
# 真实值优先通过 WEIXIN_ALLOWED_USERS 提供；为空时插件拒绝全部消息。
allowed_users = []
account_id = ""
dm_only = true
private_next_ttl_seconds = 120
# “搞定了”等短回复只关联 24 小时内最近一组明确任务。
completion_context_ttl_seconds = 86400
# 多候选确认列表保留 5 分钟。
completion_confirmation_ttl_seconds = 300
# 任务缺少日期、时间或重复次数时，结构化上下文保留 10 分钟。
task_clarification_ttl_seconds = 600

[obsidian]
# 每套运行档案使用自己的精确路径；不要指向另一人的目录。
vault_path = ""
private_inbox_path = ""
default_note_path = "Inbox/微信收件箱.md"
max_links = 3
mapping_confirmed = false
known_links = []

[media]
vision_enabled = true
voice_asr_enabled = true
image_max_files = 4
image_max_bytes = 16777216
image_max_dimension = 2048
audio_max_bytes = 26214400
media_text_max_chars = 12000
# Chinese CPU INT8 backend; prepare its pinned local files before enabling.
# Existing profiles without this key keep Whisper for backward compatibility.
asr_backend = "paraformer"
asr_threads = 2
# Only used when asr_backend = "whisper".
asr_model = "small"
asr_language = "zh"
# Only Whisper uses this static vocabulary. ONNX backends use no prompts/hotwords.
asr_vocabulary = ["试剂盒", "抗体", "流式", "分选", "询价", "ChatGPT", "B2M"]
# 只允许读取当前档案 HERMES_HOME 下明确的媒体缓存目录。
allowed_cache_roots = []

[web]
# 只读取公开 HTTP/HTTPS HTML 或纯文本页面；阻止本机、内网、登录态和非标准端口。
enabled = false
max_urls = 1
max_bytes = 2097152
max_text_chars = 18000
timeout_seconds = 15
max_redirects = 3
# 仅在本机代理明确使用 RFC 2544 fake-IP DNS 时开启；不会放行其他私网段。
allow_proxy_fake_ip = false

[reminders]
# 真实提醒在最终验收确认前保持关闭。
enabled = false
poll_seconds = 15
# 休眠/断网恢复后，超过 2 小时的到期提醒合并为一条摘要。
overdue_merge_seconds = 7200
retry_seconds = 60
# 明确说“提醒我”的消息只写入本地微信队列，不额外创建滴答任务。
local_only_explicit = true
# 对“明天提交”“这周办理”这类有日期但没说钟点的长期待办，
# 自动创建一次本地提醒；回复会明确显示实际采用的时间。
default_for_dated_tasks = true
default_day_time = "09:00"
# 1=周一，5=周五，7=周日；整周事项仍以周日作为截止日期。
default_week_weekday = 5
default_week_time = "16:00"

[dida]
server = "dida365"
mapping_confirmed = false
schema_confirmed = false
# 授权后读取 complete_task 工具结构并实测回读，再改为 true。
complete_schema_confirmed = false

# 授权并读取现有清单后再填写；值必须是现有清单 ID。
[dida.category_map]

# 授权并读取现有标签后再填写；值必须是现有标签名或 ID。
[dida.tag_map]

# 查看 Vault 结构并确认后再填写。值是 Vault 内相对路径。
[obsidian.folder_map]
