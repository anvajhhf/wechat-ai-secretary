[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-ai-secretary"
version = "0.1.0"
description = "本机运行的 Hermes + DeepSeek 微信个人秘书"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "anvajhhf"}]
requires-python = ">=3.11,<3.14"
keywords = ["wechat", "assistant", "hermes-agent", "deepseek", "reminder"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "Pillow>=11.3,<13",
  "tzdata>=2025.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
media = [
  "faster-whisper>=1.2.1,<2",
  "silk-python>=0.2.8,<0.3",
  "sherpa-onnx==1.13.6",
  "sherpa-onnx-core==1.13.6",
]

[project.scripts]
wechat-secretary = "wechat_secretary.cli:main"

[project.urls]
Repository = "https://github.com/anvajhhf/wechat-ai-secretary"
Issues = "https://github.com/anvajhhf/wechat-ai-secretary/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
